[package]
name = "main"
version = "0.1.0"
edition = "2021"

description = "software for my watch"
authors = ["Desmond Mehta <desmondmehta@gmail.com>"]
keywords = ["embedded-hal", "embedded-hal-async"]
categories = ["embedded", "no-std"]

[dependencies]
defmt = "0.3.8"
anyhow = { version = "1.0", default-features = false }
co5300 = { path = "../co5300/" }
chsc6417 = { path = "../chsc6417/" }
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.1"
rtic = {version = "2.1.1", features=["thumbv7-backend", "rtic-monotonics"]}
rtic-monotonics = { version = "2.0.1", features = ["cortex-m-systick"]}
panic-halt = "0.2.0"
embedded-hal = "1.0.0"
defmt-rtt = { version = "0.4.1"}
rtic-sync = "1.3.0"

embassy-stm32 = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "stm32h7s7l8", "time-driver-tim2", "exti", "memory-x", "unstable-pac", "chrono"] }
embassy-sync = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt"] }
# embassy-executor = { version = "0.6.0", git = "https://github.com/embassy-rs/embassy.git", features = ["task-arena-size-32768", "arch-cortex-m", "executor-thread", "executor-interrupt", "defmt", "integrated-timers"] }
embassy-time = { version = "0.3.2", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-net = { version = "0.4.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet", "proto-ipv6", "dns"] }
embassy-usb = { version = "0.3.0", git = "https://github.com/embassy-rs/embassy.git", features = ["defmt"] }
embassy-futures = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy.git" }

embedded-hal-async = { version = "1.0" }
# embedded-nal-async = { version = "0.7.1" }
embedded-io-async = { version = "0.6.1" }
panic-probe = { version = "0.3", features = ["print-defmt"] }
heapless = { version = "0.8", default-features = false }
rand_core = "0.6.3"
critical-section = "1.1"
micromath = "2.0.0"
stm32-fmc = "0.3.0"
embedded-storage = "0.3.1"
static_cell = "2"
chrono = { version = "^0.4", default-features = false }

[package.metadata.docs.rs]
all-features = true

# [[bin]]
# name = "stm32f3-blinky"
# test = false
# bench = false

[profile.dev]
opt-level = 1
codegen-units = 16
debug = true
lto = false

[profile.release]
opt-level = "s"   # optimize for size
codegen-units = 1 # better optimizations
debug = true      # symbols are nice and they don't increase the size on Flash
lto = true        # better optimizations
